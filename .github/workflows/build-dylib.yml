name: Build iOS dylib

on:
  repository_dispatch:
    types: [build-dylib]
  workflow_dispatch:
    inputs:
      source_code:
        description: 'C/Objective-C source code'
        required: true
        type: string
      filename:
        description: 'Output dylib name (without .dylib)'
        required: false
        default: 'libexample'
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create source file
        env:
          SOURCE_B64: ${{ github.event.client_payload.source_b64 || '' }}
          SOURCE_RAW: ${{ github.event.client_payload.source || inputs.source_code || '' }}
          FILENAME_IN: ${{ github.event.client_payload.filename || inputs.filename || 'libexample' }}
        run: |
          set -e
          mkdir -p src

          if [ -n "$SOURCE_B64" ]; then
            echo "$SOURCE_B64" | base64 -d > src/lib.m
            echo "Using base64 source"
          elif [ -n "$SOURCE_RAW" ]; then
            printf '%s' "$SOURCE_RAW" > src/lib.m
            echo "Using raw source"
          else
            echo "ERROR: No source code provided" >&2
            exit 1
          fi

          # Sanitize filename
          FILENAME=$(echo "$FILENAME_IN" | tr -cd '[:alnum:]_-')
          if [ -z "$FILENAME" ]; then
            FILENAME="libexample"
          fi
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

          echo "===== Source file ====="
          cat -n src/lib.m
          echo "======================="
          ls -la src/

      - name: Compile arm64 iOS dylib (with UIKit)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK"
          echo "Output will be: ${FILENAME}.dylib"

          clang -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=14.0 \
                -fobjc-arc \
                -fmodules \
                -dynamiclib \
                -o "${FILENAME}.dylib" \
                src/lib.m \
                -framework Foundation \
                -framework UIKit \
                -framework CoreGraphics \
                -framework QuartzCore \
                -framework CoreFoundation

          echo "===== Built file ====="
          file "${FILENAME}.dylib"
          ls -lh "${FILENAME}.dylib"
          echo "======================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}-dylib
          path: ${{ env.FILENAME }}.dylib
          if-no-files-found: error
          retention-days: 3
