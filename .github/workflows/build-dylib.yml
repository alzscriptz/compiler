name: Build iOS dylib

on:
  repository_dispatch:
    types: [build-dylib]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit SHA containing src/lib.m'
        required: false
        type: string
      source_code:
        description: 'C/Objective-C source code'
        required: false
        type: string
      filename:
        description: 'Output dylib name (without .dylib)'
        required: false
        default: 'libexample'
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.source_ref || inputs.source_ref || github.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create source file
        env:
          SOURCE_REF: ${{ github.event.client_payload.source_ref || inputs.source_ref || '' }}
          SOURCE_B64: ${{ github.event.client_payload.source_b64 || '' }}
          SOURCE_RAW: ${{ github.event.client_payload.source || inputs.source_code || '' }}
          FILENAME_IN: ${{ github.event.client_payload.filename || inputs.filename || 'libexample' }}
        run: |
          set -euo pipefail
          mkdir -p src
          if [ -n "$SOURCE_REF" ]; then
            test -s src/lib.m || { echo "ERROR: source commit does not contain src/lib.m" >&2; exit 1; }
          elif [ -n "$SOURCE_B64" ]; then
            echo "$SOURCE_B64" | base64 -d > src/lib.m
          elif [ -n "$SOURCE_RAW" ]; then
            printf '%s' "$SOURCE_RAW" > src/lib.m
          else
            echo "ERROR: No source code provided" >&2
            exit 1
          fi
          FILENAME=$(printf '%s' "$FILENAME_IN" | tr -cd '[:alnum:]_-')
          [ -n "$FILENAME" ] || FILENAME="libexample"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "Source size: $(wc -c < src/lib.m) bytes"

      - name: Compile arm64 iOS dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)
          echo "Using SDK: $SDK"
          echo "Using clang: $CLANG"
          "$CLANG" \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -o "${FILENAME}.dylib" \
            src/lib.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore
          file "${FILENAME}.dylib"
          ls -lh "${FILENAME}.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}-dylib
          path: ${{ env.FILENAME }}.dylib
          if-no-files-found: error
          retention-days: 3
