name: Build iOS dylib

on:
  repository_dispatch:
    types: [build-dylib]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit SHA containing src/lib.m'
        required: false
        type: string
      source_code:
        description: 'C/Objective-C source code'
        required: false
        type: string
      filename:
        description: 'Output dylib name (without .dylib)'
        required: false
        default: 'libexample'
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.source_ref || inputs.source_ref || github.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create source file
        env:
          SOURCE_REF: ${{ github.event.client_payload.source_ref || inputs.source_ref || '' }}
          SOURCE_B64: ${{ github.event.client_payload.source_b64 || '' }}
          SOURCE_RAW: ${{ github.event.client_payload.source || inputs.source_code || '' }}
          FILENAME_IN: ${{ github.event.client_payload.filename || inputs.filename || 'libexample' }}
        run: |
          set -euo pipefail
          mkdir -p src
          if [ -n "$SOURCE_REF" ]; then
            test -s src/lib.m || { echo "ERROR: source commit does not contain src/lib.m" >&2; exit 1; }
          elif [ -n "$SOURCE_B64" ]; then
            echo "$SOURCE_B64" | base64 -d > src/lib.m
          elif [ -n "$SOURCE_RAW" ]; then
            printf '%s' "$SOURCE_RAW" > src/lib.m
          else
            echo "ERROR: No source code provided" >&2
            exit 1
          fi
          FILENAME=$(printf '%s' "$FILENAME_IN" | tr -cd '[:alnum:]_-')
          [ -n "$FILENAME" ] || FILENAME="libexample"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

          # Objective-C requires file-scope declarations before C functions
          # are referenced. Keep uploaded source intact while providing
          # forward declarations for the overlay helper functions used
          # earlier in the file.
          if grep -q "FindBestWindowForOverlay();" src/lib.m && ! grep -q "^static UIWindow \*FindBestWindowForOverlay(void);" src/lib.m; then
            tmp="src/lib.m.fixed"
            {
              printf '%s\n' '#import <UIKit/UIKit.h>'
              printf '%s\n' '#import <QuartzCore/QuartzCore.h>'
              printf '%s\n' ''
              printf '%s\n' 'static UIWindow *FindBestWindowForOverlay(void);'
              printf '%s\n' 'static void AttachOverlayAttempt(NSUInteger attempt);'
              printf '%s\n' 'static void attachOverlayToWindow(void);'
              printf '%s\n' ''
              cat src/lib.m
            } > "$tmp"
            mv "$tmp" src/lib.m
          fi

          # Normalize the most common Objective-C empty-string mistake:
          # NSString expressions must use Objective-C string literals (@""),
          # not C string literals (""). This is safe for nil-coalescing and
          # ternary fallbacks where the other operand is an Objective-C object.
          perl -0pi -e 's/(\?\s*:\s*)""/$1\@""/g; s/(\?\?\s*)""/$1\@""/g' src/lib.m

          # Repair the known embedded-interpreter layout produced by older
          # compiler UI versions: the interpreter must be declared before the
          # ExecutorOverlayView implementation, not appended after its constructor.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/lib.m")
          s = p.read_text(encoding="utf-8")
          first = s.find("@interface ExecutorOverlayView")
          second = s.find("@interface ExecutorOverlayView", first + 10) if first >= 0 else -1
          env = s.find("@interface OCIEnvironment")
          ctor = s.find("#pragma mark - Constructor")
          last_end = s.rfind("@end")

          if first >= 0 and second >= 0 and env > ctor >= 0 and last_end > second:
              clean_ctor = '''#pragma mark - Constructor

__attribute__((constructor))
static void initializeHook(void)
{
    dispatch_async(
        dispatch_get_main_queue(),
        ^{
            attachOverlayToWindow();
        }
    );
}

'''
              interpreter = s[env:second]
              global_tail = s[last_end + len("@end"):]
              s = s[:ctor] + clean_ctor + interpreter + global_tail
              p.write_text(s, encoding="utf-8")
              echo = "Repaired legacy embedded-interpreter layout."
              print(echo)

          print(f"Final source size: {p.stat().st_size} bytes")
          PY

          echo "Source size: $(wc -c < src/lib.m) bytes"

      - name: Validate Objective-C source
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)
          echo "Running syntax/type validation first..."
          FRAMEWORK_ARGS=(-framework Foundation -framework UIKit -framework QuartzCore)
          while IFS= read -r framework; do
            [ -n "$framework" ] || continue
            case "$framework" in Foundation|UIKit|QuartzCore|Darwin|objc|os) continue;; esac
            if [ -d "$SDK/System/Library/Frameworks/$framework.framework" ] || [ -d "$SDK/System/Library/PrivateFrameworks/$framework.framework" ]; then
              already=0
              for existing in "${FRAMEWORK_ARGS[@]}"; do [ "$existing" = "$framework" ] && already=1; done
              [ "$already" -eq 0 ] && FRAMEWORK_ARGS+=(-framework "$framework")
            fi
          done < <(
            {
              sed -nE 's/^[[:space:]]*#import[[:space:]]*[<"]([A-Za-z0-9_]+)(\/.*)?[>"].*$/\1/p' src/lib.m
              sed -nE 's/^[[:space:]]*@import[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*;.*/\1/p' src/lib.m
            } | sort -u
          )
          "$CLANG" \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -fmodules \
            -fsyntax-only \
            src/lib.m \
            ${FRAMEWORK_ARGS[@]}

      - name: Compile arm64 iOS dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)
          echo "Using SDK: $SDK"
          echo "Using clang: $CLANG"

          # Link Foundation/UIKit/QuartzCore plus every iOS framework explicitly
          # imported by the submitted source. This lets normal Objective-C
          # snippets use WebKit, AVFoundation, Security, CoreGraphics, etc.
          # without requiring the frontend to know the framework list.
          FRAMEWORK_ARGS=(-framework Foundation -framework UIKit -framework QuartzCore)
          while IFS= read -r framework; do
            [ -n "$framework" ] || continue
            case "$framework" in
              Foundation|UIKit|QuartzCore|Darwin|objc|os)
                continue
                ;;
            esac
            if [ -d "$SDK/System/Library/Frameworks/$framework.framework" ] || [ -d "$SDK/System/Library/PrivateFrameworks/$framework.framework" ]; then
              already=0
              for existing in "${FRAMEWORK_ARGS[@]}"; do
                [ "$existing" = "$framework" ] && already=1
              done
              [ "$already" -eq 0 ] && FRAMEWORK_ARGS+=(-framework "$framework")
            fi
          done < <(
            {
              sed -nE 's/^[[:space:]]*#import[[:space:]]*[<"]([A-Za-z0-9_]+)(\/.*)?[>"].*$/\1/p' src/lib.m
              sed -nE 's/^[[:space:]]*@import[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*;.*/\1/p' src/lib.m
            } | sort -u
          )

          echo "Frameworks:"
          printf '  %s\n' "${FRAMEWORK_ARGS[@]}"
          "$CLANG" \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -o "${FILENAME}.dylib" \
            src/lib.m \
            ${FRAMEWORK_ARGS[@]}
          file "${FILENAME}.dylib"
          ls -lh "${FILENAME}.dylib"

      - name: Publish dylib as the latest GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILENAME}.dylib" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" "${FILENAME}.dylib" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Latest dylib build" \
              --notes "Latest dylib generated by the compiler." \
              --latest=false
          fi
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}"
