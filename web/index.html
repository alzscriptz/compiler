<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Dylib Compiler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #ccc;
    }
    input, textarea, select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      font-family: 'SF Mono', Monaco, monospace;
    }
    textarea {
      min-height: 220px;
      resize: vertical;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    button:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      display: none;
    }
    .status.show { display: block; }
    .status.success { border-color: #30d158; }
    .status.error { border-color: #ff453a; }
    .log {
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      color: #aaa;
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .download-btn {
      display: inline-block;
      margin-top: 12px;
      background: #30d158;
      color: #000;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .warning {
      background: #2a1f00;
      border: 1px solid #664d00;
      color: #ffd60a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .pat-section {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>iOS Dylib Compiler</h1>
    <p class="subtitle">Real arm64 iOS dylibs via GitHub Actions macOS runners + Xcode</p>

    <div class="warning">
      This is a personal tool. Paste a fine-grained GitHub PAT with access to the <code>compiler</code> repo (Contents + Actions). Never share this page publicly with a real token.
    </div>

    <div class="pat-section">
      <label for="pat">GitHub Personal Access Token</label>
      <input type="password" id="pat" placeholder="ghp_... or github_pat_..." autocomplete="off">
    </div>

    <label for="filename">Output filename (without .dylib)</label>
    <input type="text" id="filename" value="libexample" placeholder="libexample">

    <label for="source">Objective-C / C source</label>
    <textarea id="source">#import &lt;Foundation/Foundation.h&gt;

__attribute__((constructor))
static void init(void) {
    NSLog(@"[compiler] Hello from dylib!");
}

void example_function(void) {
    NSLog(@"[compiler] example_function called");
}</textarea>

    <button id="buildBtn" onclick="startBuild()">Compile dylib</button>

    <div id="status" class="status">
      <div id="statusText"></div>
      <div id="log" class="log"></div>
      <div id="downloadArea"></div>
    </div>
  </div>

  <script>
    const OWNER = 'alzscriptz';
    const REPO = 'compiler';

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    async function startBuild() {
      const pat = document.getElementById('pat').value.trim();
      const filename = document.getElementById('filename').value.trim() || 'libexample';
      const source = document.getElementById('source').value;

      if (!pat) {
        alert('Paste your GitHub PAT first');
        return;
      }

      const btn = document.getElementById('buildBtn');
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const downloadArea = document.getElementById('downloadArea');

      btn.disabled = true;
      status.className = 'status show';
      statusText.textContent = 'Triggering build...';
      document.getElementById('log').textContent = '';
      downloadArea.innerHTML = '';

      try {
        // 1. Trigger repository_dispatch
        log('Sending repository_dispatch...');
        const triggerRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${pat}`,
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({
            event_type: 'build-dylib',
            client_payload: {
              source: source,
              filename: filename
            }
          })
        });

        if (triggerRes.status !== 204) {
          const err = await triggerRes.text();
          throw new Error(`Trigger failed (${triggerRes.status}): ${err}`);
        }

        log('Triggered successfully. Waiting for workflow to start...');
        statusText.textContent = 'Build queued...';

        // 2. Poll for the latest run
        let runId = null;
        for (let i = 0; i < 30; i++) {
          await sleep(3000);
          const runsRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?event=repository_dispatch&per_page=5`, {
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${pat}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          const runsData = await runsRes.json();
          const run = runsData.workflow_runs?.find(r => r.status === 'queued' || r.status === 'in_progress' || r.status === 'completed');
          if (run) {
            runId = run.id;
            log(`Found run #${runId} (${run.status})`);
            break;
          }
          log('Still waiting for run to appear...');
        }

        if (!runId) throw new Error('Could not find the workflow run');

        // 3. Wait for completion
        statusText.textContent = 'Building on macOS runner...';
        let completed = false;
        for (let i = 0; i < 60; i++) {
          await sleep(5000);
          const runRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}`, {
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${pat}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          const runData = await runRes.json();
          log(`Status: ${runData.status} / ${runData.conclusion || '...'}`);

          if (runData.status === 'completed') {
            completed = true;
            if (runData.conclusion !== 'success') {
              throw new Error(`Build failed with conclusion: ${runData.conclusion}`);
            }
            break;
          }
        }

        if (!completed) throw new Error('Build timed out');

        // 4. Get artifacts
        statusText.textContent = 'Build succeeded! Fetching artifact...';
        log('Fetching artifacts...');
        const artRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}/artifacts`, {
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${pat}`,
            'X-GitHub-Api-Version': '2022-11-28'
          }
        });
        const artData = await artRes.json();
        const artifact = artData.artifacts?.[0];

        if (!artifact) throw new Error('No artifact found');

        log(`Artifact: ${artifact.name} (${artifact.size_in_bytes} bytes)`);

        // Download link (needs auth, so we open the API URL)
        const downloadUrl = `https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${artifact.id}/zip`;

        status.className = 'status show success';
        statusText.textContent = 'Done! Your dylib is ready.';
        downloadArea.innerHTML = `
          <p style="margin-top:12px">Click below to download (browser will ask for auth or use the PAT).</p>
          <a class="download-btn" href="${downloadUrl}" target="_blank">Download ${artifact.name}.zip</a>
          <p style="margin-top:10px;font-size:13px;color:#888">
            Or go to the <a href="https://github.com/${OWNER}/${REPO}/actions/runs/${runId}" target="_blank" style="color:#007aff">Actions run</a> and download from there.
          </p>
        `;

      } catch (err) {
        status.className = 'status show error';
        statusText.textContent = 'Error';
        log(err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
