<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Dylib Compiler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 0.95rem; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #ccc; }
    input, textarea {
      width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
      padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
      font-family: 'SF Mono', Monaco, monospace;
    }
    textarea { min-height: 220px; resize: vertical; }
    button {
      background: #007aff; color: white; border: none; padding: 14px 28px;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #333; cursor: not-allowed; }
    .status {
      margin-top: 24px; padding: 16px; background: #1a1a1a; border-radius: 8px;
      border: 1px solid #333; display: none;
    }
    .status.show { display: block; }
    .status.success { border-color: #30d158; }
    .status.error { border-color: #ff453a; }
    .log {
      font-family: monospace; font-size: 13px; white-space: pre-wrap; color: #aaa;
      margin-top: 12px; max-height: 220px; overflow-y: auto;
    }
    .download-btn {
      display: inline-block; margin-top: 12px; background: #30d158; color: #000;
      padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;
    }
    .warning {
      background: #2a1f00; border: 1px solid #664d00; color: #ffd60a;
      padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;
    }
    .pat-section {
      background: #1a1a1a; padding: 16px; border-radius: 8px; margin-bottom: 24px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>iOS Dylib Compiler</h1>
    <p class="subtitle">Real arm64 iOS dylibs via GitHub Actions macOS runners + Xcode</p>

    <div class="warning">
      Personal tool only. Paste a fine-grained GitHub PAT with access to the <code>compiler</code> repo (Contents + Actions). Never share this page publicly with a real token.
    </div>

    <div class="pat-section">
      <label for="pat">GitHub Personal Access Token</label>
      <input type="password" id="pat" placeholder="ghp_... or github_pat_..." autocomplete="off">
    </div>

    <label for="filename">Output filename (without .dylib)</label>
    <input type="text" id="filename" value="libexample" placeholder="libexample">

    <label for="source">Objective-C / C source</label>
    <textarea id="source">#import <Foundation/Foundation.h>

__attribute__((constructor))
static void init(void) {
    NSLog(@"[compiler] Hello from dylib!");
}

void example_function(void) {
    NSLog(@"[compiler] example_function called");
}</textarea>

    <button id="buildBtn" onclick="startBuild()">Compile dylib</button>

    <div id="status" class="status">
      <div id="statusText"></div>
      <div id="log" class="log"></div>
      <div id="downloadArea"></div>
    </div>
  </div>

  <script>
    const OWNER = 'alzscriptz';
    const REPO = 'compiler';

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(binary);
    }

    async function githubRequest(url, options) {
      return fetch(url, { ...options, headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${options.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(options.headers || {}) } });
    }

    async function startBuild() {
      const pat = document.getElementById('pat').value.trim();
      const filename = document.getElementById('filename').value.trim() || 'libexample';
      const source = document.getElementById('source').value;

      if (!pat) { alert('Paste your GitHub PAT first'); return; }

      const btn = document.getElementById('buildBtn');
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const downloadArea = document.getElementById('downloadArea');

      btn.disabled = true;
      status.className = 'status show';
      statusText.textContent = 'Triggering build...';
      document.getElementById('log').textContent = '';
      downloadArea.innerHTML = '';

      const triggerTime = Date.now();

      try {
        // 1. Upload source to a dedicated branch; repository_dispatch only carries a commit SHA.
        log('Uploading source to GitHub build-source branch...');
        const branch = 'build-source';
        const sourcePath = 'src/lib.m';

        // GitHub's Contents API is convenient but has a ~1 MB practical limit.
        // For larger sources use the Git Data API directly (blob -> tree -> commit),
        // avoiding base64 expansion and allowing much larger Git blobs.
        let sourceRef = null;
        if (new TextEncoder().encode(source).length <= 900000) {
          const sourceB64 = toBase64(source);
          let existingSha = null;
          const getRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${sourcePath}?ref=${encodeURIComponent(branch)}`, {method:'GET', token:pat});
          if (getRes.ok) existingSha = (await getRes.json()).sha || null;
          else if (getRes.status !== 404) throw new Error(`Could not inspect source (${getRes.status})`);
          const body = {message:`build: upload source ${new Date().toISOString()}`, content:sourceB64, branch:branch};
          if (existingSha) body.sha = existingSha;
          const uploadRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${sourcePath}`, {method:'PUT', token:pat, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
          if (!uploadRes.ok) { const err=await uploadRes.text(); throw new Error(`Source upload failed (${uploadRes.status}): ${err}`); }
          sourceRef = (await uploadRes.json()).commit?.sha;
        } else {
          log('Large source detected; using Git Data API upload path...');
          const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
          const headers = {'Content-Type':'application/json'};

          const refRes = await githubRequest(`${api}/git/ref/heads/${branch}`, {method:'GET', token:pat});
          if (!refRes.ok) throw new Error(`Could not read build branch (${refRes.status}): ${await refRes.text()}`);
          const parentSha = (await refRes.json()).object?.sha;
          if (!parentSha) throw new Error('Could not determine build branch commit');

          const parentRes = await githubRequest(`${api}/git/commits/${parentSha}`, {method:'GET', token:pat});
          if (!parentRes.ok) throw new Error(`Could not read parent commit (${parentRes.status}): ${await parentRes.text()}`);
          const parentData = await parentRes.json();
          const baseTree = parentData.tree?.sha;
          if (!baseTree) throw new Error('Could not determine parent tree');

          const blobRes = await githubRequest(`${api}/git/blobs`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({content:source, encoding:'utf-8'})
          });
          if (!blobRes.ok) throw new Error(`Large source blob upload failed (${blobRes.status}): ${await blobRes.text()}`);
          const blobSha = (await blobRes.json()).sha;
          if (!blobSha) throw new Error('GitHub did not return the source blob SHA');

          const treeRes = await githubRequest(`${api}/git/trees`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({
              base_tree:baseTree,
              tree:[{path:sourcePath, mode:'100644', type:'blob', sha:blobSha}]
            })
          });
          if (!treeRes.ok) throw new Error(`Git tree creation failed (${treeRes.status}): ${await treeRes.text()}`);
          const treeSha = (await treeRes.json()).sha;
          if (!treeSha) throw new Error('GitHub did not return the tree SHA');

          const commitRes = await githubRequest(`${api}/git/commits`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({
              message:`build: upload large source ${new Date().toISOString()}`,
              tree:treeSha,
              parents:[parentSha]
            })
          });
          if (!commitRes.ok) throw new Error(`Git commit creation failed (${commitRes.status}): ${await commitRes.text()}`);
          sourceRef = (await commitRes.json()).sha;
          if (!sourceRef) throw new Error('GitHub did not return the source commit SHA');

          const updateRefRes = await githubRequest(`${api}/git/refs/heads/${branch}`, {
            method:'PATCH', token:pat, headers,
            body:JSON.stringify({sha:sourceRef, force:false})
          });
          if (!updateRefRes.ok) throw new Error(`Build branch update failed (${updateRefRes.status}): ${await updateRefRes.text()}`);
        }

        if (!sourceRef) throw new Error('GitHub did not return the source commit SHA');
        log(`Source committed at ${sourceRef.slice(0,12)}`);

        // 2. Dispatch only a tiny payload.
        log('Triggering build...');
        const triggerRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {method:'POST', token:pat, headers:{'Content-Type':'application/json'}, body:JSON.stringify({event_type:'build-dylib',client_payload:{source_ref:sourceRef,filename:filename}})});
        if (triggerRes.status !== 204) {
          const err = await triggerRes.text();
          throw new Error(`Trigger failed (${triggerRes.status}): ${err}`);
        }

        log('Triggered successfully. Waiting for new workflow run...');
        statusText.textContent = 'Build queued...';

        // 2. Find the newest run created after we triggered
        let runId = null;
        for (let i = 0; i < 72; i++) {
          await sleep(5000);
          const runsRes = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?event=repository_dispatch&per_page=5`,
            {
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${pat}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            }
          );
          if (!runsRes.ok) {
            const errText = await runsRes.text();
            throw new Error(`Could not query workflow runs (${runsRes.status}): ${errText}`);
          }
          const runsData = await runsRes.json();
          const runs = runsData.workflow_runs || [];

          // Prefer a run that started after we triggered
          const fresh = runs.find(r => {
            const created = new Date(r.created_at).getTime();
            return created >= triggerTime - 30000; // 30s tolerance for GitHub API/event delay
          });

          if (fresh) {
            runId = fresh.id;
            log(`Found new run #${runId} (${fresh.status})`);
            break;
          }

          // Fallback: take the most recent one if it's still running
          const running = runs.find(r => r.status === 'queued' || r.status === 'in_progress');
          if (running) {
            runId = running.id;
            log(`Found running run #${runId}`);
            break;
          }

          log('Still waiting for run to appear...');
        }

        if (!runId) throw new Error('Could not find the workflow run');

        // 3. Wait for completion
        statusText.textContent = 'Building on macOS runner...';
        let conclusion = null;
        for (let i = 0; i < 60; i++) {
          await sleep(5000);
          const runRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}`, {
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${pat}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          const runData = await runRes.json();
          log(`Status: ${runData.status} / ${runData.conclusion || '...'}`);

          if (runData.status === 'completed') {
            conclusion = runData.conclusion;
            break;
          }
        }

        if (!conclusion) throw new Error('Build timed out');

        if (conclusion !== 'success') {
          throw new Error(`Build failed (${conclusion}). Check logs: https://github.com/${OWNER}/${REPO}/actions/runs/${runId}`);
        }

        // 4. Get artifacts
        statusText.textContent = 'Build succeeded! Fetching artifact...';
        log('Fetching artifacts...');
        await sleep(2000); // small delay for artifact registration

        const artRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}/artifacts`, {
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${pat}`,
            'X-GitHub-Api-Version': '2022-11-28'
          }
        });
        const artData = await artRes.json();
        const artifact = artData.artifacts?.[0];

        if (!artifact) {
          throw new Error(`No artifact found. Open the run and check the logs: https://github.com/${OWNER}/${REPO}/actions/runs/${runId}`);
        }

        log(`Artifact: ${artifact.name} (${artifact.size_in_bytes} bytes)`);

        const downloadUrl = `https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${artifact.id}/zip`;

        status.className = 'status show success';
        statusText.textContent = 'Done! Your dylib is ready.';
        downloadArea.innerHTML = `
          <p style="margin-top:12px">Download (may require being logged into GitHub in this browser):</p>
          <a class="download-btn" href="${downloadUrl}" target="_blank">Download ${artifact.name}.zip</a>
          <p style="margin-top:10px;font-size:13px;color:#888">
            Or open the <a href="https://github.com/${OWNER}/${REPO}/actions/runs/${runId}" target="_blank" style="color:#007aff">Actions run</a> and download the artifact from there.
          </p>
        `;

      } catch (err) {
        status.className = 'status show error';
        statusText.textContent = 'Error';
        log(err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
