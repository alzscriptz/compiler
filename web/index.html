<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Dylib Compiler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08090b;
    --panel: rgba(20, 22, 27, 0.78);
    --panel-strong: rgba(24, 26, 32, 0.9);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f5f7fa;
    --muted: #9aa1ad;
    --accent: #7c9cff;
    --accent-strong: #5f7ff0;
    --success: #45d483;
    --danger: #ff5c68;
  }

  html { min-height: 100%; }

  body {
    min-height: 100vh;
    padding: 32px 18px 48px;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 50% -10%, rgba(124, 156, 255, 0.16), transparent 42%),
      radial-gradient(circle at 10% 100%, rgba(255, 255, 255, 0.04), transparent 30%),
      var(--bg);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.025), transparent 45%),
      linear-gradient(180deg, rgba(255,255,255,0.015), transparent 35%);
  }

  .snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .flake {
    position: absolute;
    top: -12px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    filter: blur(0.2px);
    box-shadow: 0 0 8px rgba(255,255,255,0.22);
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translate3d(var(--drift), 110vh, 0); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: min(100%, 800px);
    margin: 0 auto;
  }

  .hero {
    margin-bottom: 26px;
    text-align: center;
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1;
    letter-spacing: -0.055em;
    font-weight: 800;
    color: transparent;
    background: linear-gradient(110deg, #ffffff 0%, #9fb6ff 42%, #b98cff 72%, #ffffff 100%);
    background-size: 180% auto;
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: 0 0 34px rgba(124, 156, 255, 0.16);
    animation: titleGlow 7s ease-in-out infinite alternate;
  }

  @keyframes titleGlow {
    from { background-position: 0% center; }
    to { background-position: 100% center; }
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .panel {
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.018)), var(--panel);
    box-shadow: 0 22px 70px rgba(0,0,0,0.3), inset 0 1px rgba(255,255,255,0.04);
    backdrop-filter: blur(18px);
  }

  .field { margin-bottom: 18px; }

  .token-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .token-row input { flex: 1; min-width: 0; }

  .save-token-btn {
    width: auto;
    flex: 0 0 auto;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 13px;
    background: rgba(124, 156, 255, 0.14);
    border: 1px solid rgba(124, 156, 255, 0.24);
    box-shadow: none;
    white-space: nowrap;
  }

  .save-token-btn:hover {
    background: rgba(124, 156, 255, 0.22);
    box-shadow: 0 8px 20px rgba(95, 127, 240, 0.12);
  }

  .token-menu {
    position: relative;
    margin-top: 8px;
    display: none;
  }

  .token-menu.show { display: block; }

  .saved-token {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
  }

  .saved-token-name {
    flex: 1;
    min-width: 0;
    color: #cbd1dc;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .token-action {
    width: auto;
    padding: 6px 9px;
    border-radius: 9px;
    font-size: 11px;
    background: rgba(255,255,255,0.06);
    box-shadow: none;
  }

  .token-action.delete {
    color: #ff9aa2;
    background: rgba(255,92,104,0.08);
  }

  label {
    display: block;
    margin: 0 0 8px 4px;
    color: #d9dde5;
    font-size: 0.86rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  input, textarea {
    width: 100%;
    color: var(--text);
    background: rgba(8, 10, 14, 0.72);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    outline: none;
    font-size: 14px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    box-shadow: inset 0 1px rgba(255,255,255,0.025);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
  }

  textarea {
    min-height: 240px;
    resize: vertical;
    line-height: 1.55;
  }

  input:focus, textarea:focus {
    border-color: rgba(124, 156, 255, 0.55);
    background: rgba(10, 12, 17, 0.9);
    box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.09), 0 10px 30px rgba(0,0,0,0.18);
    transform: translateY(-1px);
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 17px;
    padding: 15px 24px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 12px 30px rgba(95, 127, 240, 0.22), inset 0 1px rgba(255,255,255,0.24);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 16px 38px rgba(95, 127, 240, 0.28), inset 0 1px rgba(255,255,255,0.24); }
  button:active { transform: translateY(0) scale(0.985); }
  button:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  .status {
    margin-top: 18px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel-strong);
    box-shadow: inset 0 1px rgba(255,255,255,0.035);
    display: none;
  }

  .status.show { display: block; }
  .status.success { border-color: rgba(69, 212, 131, 0.38); }
  .status.error { border-color: rgba(255, 92, 104, 0.38); }

  .log {
    margin-top: 12px;
    max-height: 220px;
    overflow-y: auto;
    color: #aeb5c1;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .download-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 11px 18px;
    border-radius: 13px;
    color: #07120b;
    background: var(--success);
    text-decoration: none;
    font-weight: 700;
    transition: transform .16s ease, filter .16s ease;
  }

  .download-btn:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.05); }
  .download-btn:active { transform: scale(.98); }

  @media (max-width: 560px) {
    body { padding: 22px 12px 32px; }
    .panel { padding: 16px; border-radius: 20px; }
    textarea { min-height: 210px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  <div class="container">
    <div class="hero">
      <h1>K1ecompile</h1>
      <p class="subtitle">Build your iOS dylib</p>
    </div>

    <div class="panel">
      <div class="field">
        <label for="pat">GitHub token</label>
        <div class="token-row">
          <input type="password" id="pat" placeholder="Paste token" autocomplete="off">
          <button type="button" class="save-token-btn" onclick="saveToken()">Save</button>
        </div>
        <div id="tokenMenu" class="token-menu"></div>
      </div>

      <div class="field">
        <label for="filename">Output filename</label>
        <input type="text" id="filename" value="libexample" placeholder="libexample">
      </div>

      <div class="field">
        <label for="source">Source</label>
        <textarea id="source">#import <Foundation/Foundation.h>

__attribute__((constructor))
static void init(void) {
    NSLog(@"[compiler] Hello from dylib!");
}

void example_function(void) {
    NSLog(@"[compiler] example_function called");
}</textarea>
      </div>

      <button id="buildBtn" onclick="startBuild()">Compile dylib</button>

      <div id="status" class="status">
        <div id="statusText"></div>
        <div id="log" class="log"></div>
        <div id="downloadArea"></div>
      </div>
    </div>
  </div>

<script>
    const OWNER = 'alzscriptz';
    renderSavedTokens();
    const REPO = 'compiler';

    function getSavedTokens() {
      try { return JSON.parse(localStorage.getItem('k1ecompile_tokens') || '[]'); }
      catch { return []; }
    }

    function saveToken() {
      const input = document.getElementById('pat');
      const token = input.value.trim();
      if (!token) { input.focus(); return; }

      const tokens = getSavedTokens();
      const existing = tokens.find(t => t.token === token);
      if (!existing) {
        const name = prompt('Name this token', 'GitHub token');
        if (name === null) return;
        tokens.unshift({ id: crypto.randomUUID(), name: name.trim() || 'GitHub token', token });
        localStorage.setItem('k1ecompile_tokens', JSON.stringify(tokens));
      }
      renderSavedTokens();
    }

    function selectToken(id) {
      const token = getSavedTokens().find(t => t.id === id);
      if (!token) return;
      document.getElementById('pat').value = token.token;
      renderSavedTokens();
    }

    function deleteToken(id) {
      const tokens = getSavedTokens().filter(t => t.id !== id);
      localStorage.setItem('k1ecompile_tokens', JSON.stringify(tokens));
      renderSavedTokens();
    }

    function renderSavedTokens() {
      const menu = document.getElementById('tokenMenu');
      const tokens = getSavedTokens();
      menu.classList.toggle('show', tokens.length > 0);
      menu.innerHTML = tokens.map(t => `
        <div class="saved-token">
          <span class="saved-token-name">${escapeHtml(t.name)}</span>
          <button type="button" class="token-action" onclick="selectToken('${t.id}')">Use</button>
          <button type="button" class="token-action delete" onclick="deleteToken('${t.id}')">Delete</button>
        </div>
      `).join('');
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(binary);
    }

    async function githubRequest(url, options) {
      return fetch(url, { ...options, headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${options.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(options.headers || {}) } });
    }

    async function startBuild() {
      const pat = document.getElementById('pat').value.trim();
      const filename = document.getElementById('filename').value.trim() || 'libexample';
      function repairLegacyInterpreterLayout(input) {
        const first = input.indexOf('@interface ExecutorOverlayView');
        const second = first >= 0 ? input.indexOf('@interface ExecutorOverlayView', first + 10) : -1;
        const env = input.indexOf('@interface OCIEnvironment');
        const ctor = input.indexOf('#pragma mark - Constructor');
        const lastEnd = input.lastIndexOf('@end');

        if (first < 0 || second < 0 || env <= ctor || ctor < 0 || lastEnd <= second) {
          return input;
        }

        const cleanCtor = `#pragma mark - Constructor

__attribute__((constructor))
static void initializeHook(void)
{
    dispatch_async(
        dispatch_get_main_queue(),
        ^{
            attachOverlayToWindow();
        }
    );
}

`;
        const interpreter = input.slice(env, second);
        const globalTail = input.slice(lastEnd + 4);
        return input.slice(0, ctor) + cleanCtor + interpreter + globalTail;
      }

      const source = repairLegacyInterpreterLayout(document.getElementById('source').value);

      if (!pat) { alert('Paste your GitHub PAT first'); return; }

      const btn = document.getElementById('buildBtn');
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const downloadArea = document.getElementById('downloadArea');

      btn.disabled = true;
      status.className = 'status show';
      statusText.textContent = 'Triggering build...';
      document.getElementById('log').textContent = '';
      downloadArea.innerHTML = '';

      const triggerTime = Date.now();

      try {
        // 1. Upload source to a dedicated branch; repository_dispatch only carries a commit SHA.
        log('Uploading source to GitHub build-source branch...');
        const branch = 'build-source';
        const sourcePath = 'src/lib.m';

        // GitHub's Contents API is convenient but has a ~1 MB practical limit.
        // For larger sources use the Git Data API directly (blob -> tree -> commit),
        // avoiding base64 expansion and allowing much larger Git blobs.
        let sourceRef = null;
        if (new TextEncoder().encode(source).length <= 900000) {
          const sourceB64 = toBase64(source);
          let existingSha = null;
          const getRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${sourcePath}?ref=${encodeURIComponent(branch)}`, {method:'GET', token:pat});
          if (getRes.ok) existingSha = (await getRes.json()).sha || null;
          else if (getRes.status !== 404) throw new Error(`Could not inspect source (${getRes.status})`);
          const body = {message:`build: upload source ${new Date().toISOString()}`, content:sourceB64, branch:branch};
          if (existingSha) body.sha = existingSha;
          const uploadRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${sourcePath}`, {method:'PUT', token:pat, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
          if (!uploadRes.ok) { const err=await uploadRes.text(); throw new Error(`Source upload failed (${uploadRes.status}): ${err}`); }
          sourceRef = (await uploadRes.json()).commit?.sha;
        } else {
          log('Large source detected; using Git Data API upload path...');
          const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
          const headers = {'Content-Type':'application/json'};

          const refRes = await githubRequest(`${api}/git/ref/heads/${branch}`, {method:'GET', token:pat});
          if (!refRes.ok) throw new Error(`Could not read build branch (${refRes.status}): ${await refRes.text()}`);
          const parentSha = (await refRes.json()).object?.sha;
          if (!parentSha) throw new Error('Could not determine build branch commit');

          const parentRes = await githubRequest(`${api}/git/commits/${parentSha}`, {method:'GET', token:pat});
          if (!parentRes.ok) throw new Error(`Could not read parent commit (${parentRes.status}): ${await parentRes.text()}`);
          const parentData = await parentRes.json();
          const baseTree = parentData.tree?.sha;
          if (!baseTree) throw new Error('Could not determine parent tree');

          const blobRes = await githubRequest(`${api}/git/blobs`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({content:source, encoding:'utf-8'})
          });
          if (!blobRes.ok) throw new Error(`Large source blob upload failed (${blobRes.status}): ${await blobRes.text()}`);
          const blobSha = (await blobRes.json()).sha;
          if (!blobSha) throw new Error('GitHub did not return the source blob SHA');

          const treeRes = await githubRequest(`${api}/git/trees`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({
              base_tree:baseTree,
              tree:[{path:sourcePath, mode:'100644', type:'blob', sha:blobSha}]
            })
          });
          if (!treeRes.ok) throw new Error(`Git tree creation failed (${treeRes.status}): ${await treeRes.text()}`);
          const treeSha = (await treeRes.json()).sha;
          if (!treeSha) throw new Error('GitHub did not return the tree SHA');

          const commitRes = await githubRequest(`${api}/git/commits`, {
            method:'POST', token:pat, headers,
            body:JSON.stringify({
              message:`build: upload large source ${new Date().toISOString()}`,
              tree:treeSha,
              parents:[parentSha]
            })
          });
          if (!commitRes.ok) throw new Error(`Git commit creation failed (${commitRes.status}): ${await commitRes.text()}`);
          sourceRef = (await commitRes.json()).sha;
          if (!sourceRef) throw new Error('GitHub did not return the source commit SHA');

          const updateRefRes = await githubRequest(`${api}/git/refs/heads/${branch}`, {
            method:'PATCH', token:pat, headers,
            body:JSON.stringify({sha:sourceRef, force:false})
          });
          if (!updateRefRes.ok) throw new Error(`Build branch update failed (${updateRefRes.status}): ${await updateRefRes.text()}`);
        }

        if (!sourceRef) throw new Error('GitHub did not return the source commit SHA');
        log(`Source committed at ${sourceRef.slice(0,12)}`);

        // 2. Dispatch only a tiny payload.
        log('Triggering build...');
        const triggerRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {method:'POST', token:pat, headers:{'Content-Type':'application/json'}, body:JSON.stringify({event_type:'build-dylib',client_payload:{source_ref:sourceRef,filename:filename}})});
        if (triggerRes.status !== 204) {
          const err = await triggerRes.text();
          throw new Error(`Trigger failed (${triggerRes.status}): ${err}`);
        }

        log('Triggered successfully. Waiting for new workflow run...');
        statusText.textContent = 'Build queued...';

        // 2. Find the newest run created after we triggered
        let runId = null;
        for (let i = 0; i < 72; i++) {
          await sleep(5000);
          const runsRes = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?event=repository_dispatch&per_page=5`,
            {
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${pat}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            }
          );
          if (!runsRes.ok) {
            const errText = await runsRes.text();
            throw new Error(`Could not query workflow runs (${runsRes.status}): ${errText}`);
          }
          const runsData = await runsRes.json();
          const runs = runsData.workflow_runs || [];

          // Prefer a run that started after we triggered
          const fresh = runs.find(r => {
            const created = new Date(r.created_at).getTime();
            return created >= triggerTime - 30000; // 30s tolerance for GitHub API/event delay
          });

          if (fresh) {
            runId = fresh.id;
            log(`Found new run #${runId} (${fresh.status})`);
            break;
          }

          // Fallback: take the most recent one if it's still running
          const running = runs.find(r => r.status === 'queued' || r.status === 'in_progress');
          if (running) {
            runId = running.id;
            log(`Found running run #${runId}`);
            break;
          }

          log('Still waiting for run to appear...');
        }

        if (!runId) throw new Error('Could not find the workflow run');

        // 3. Wait for completion
        statusText.textContent = 'Building on macOS runner...';
        let conclusion = null;
        for (let i = 0; i < 60; i++) {
          await sleep(5000);
          const runRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}`, {
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${pat}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          const runData = await runRes.json();
          log(`Status: ${runData.status} / ${runData.conclusion || '...'}`);

          if (runData.status === 'completed') {
            conclusion = runData.conclusion;
            break;
          }
        }

        if (!conclusion) throw new Error('Build timed out');

        if (conclusion !== 'success') {
          throw new Error(`Build failed (${conclusion}). Check logs: https://github.com/${OWNER}/${REPO}/actions/runs/${runId}`);
        }

        // 4. Fetch the dylib from the GitHub Release created by the workflow.
        // We intentionally do not use Actions artifacts: the repository's
        // Actions artifact quota can block uploads even when compilation succeeds.
        statusText.textContent = 'Build succeeded! Fetching dylib...';
        log('Fetching release asset...');

        const releaseTag = 'latest-build';
        let release = null;
        for (let i = 0; i < 12; i++) {
          const releaseRes = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${encodeURIComponent(releaseTag)}`,
            {
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${pat}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            }
          );

          if (releaseRes.ok) {
            release = await releaseRes.json();
            break;
          }

          if (releaseRes.status !== 404) {
            const errText = await releaseRes.text();
            throw new Error(`Could not fetch build release (${releaseRes.status}): ${errText}`);
          }

          log('Release is still being published...');
          await sleep(2000);
        }

        if (!release) {
          throw new Error(`Build succeeded, but the latest-build release was not found.`);
        }

        const asset = (release.assets || []).find(a =>
          a.name === `${filename}.dylib`
        ) || release.assets?.[0];

        if (!asset) {
          throw new Error(`Build release exists, but no dylib asset was found. Open: https://github.com/${OWNER}/${REPO}/releases/tag/${encodeURIComponent(releaseTag)}`);
        }

        log(`Dylib: ${asset.name} (${asset.size} bytes)`);

        status.className = 'status show success';
        statusText.textContent = 'Done! Your dylib is ready.';
        downloadArea.innerHTML = `
          <p style="margin-top:12px">Download the compiled dylib:</p>
          <a class="download-btn" href="${asset.browser_download_url}" target="_blank" rel="noopener">Download ${asset.name}</a>
          <p style="margin-top:10px;font-size:13px;color:#888">
            Release:
            <a href="${release.html_url}" target="_blank" rel="noopener" style="color:#007aff">latest-build</a>
          </p>
        `;


      } catch (err) {
        status.className = 'status show error';
        statusText.textContent = 'Error';
        log(err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
